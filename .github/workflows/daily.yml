name: daily-collection

# The spine of the study. Runs unattended for 15 weeks.
#
# The commit this job makes each day is not just bookkeeping -- it is the
# EVIDENCE. Every forecast is committed to a public, timestamped, append-only
# history before its event resolves. That is what makes "we registered this in
# advance" externally checkable rather than something we merely assert, and it
# is the single strongest answer to the standard objection against any
# LLM-forecasting result: "how do we know you didn't run this afterwards?"

on:
  schedule:
    # 13:10 UTC daily = 09:10 ET, after US macro releases (08:30 ET) and before
    # the equity open, so the market-state snapshot is same-day and meaningful.
    #
    # GitHub treats this as a hint, not a promise: across the first twelve
    # scheduled runs the job actually started between 30 minutes and 10 hours
    # late. That is ordinary queueing for scheduled workflows, and it is not
    # something the repository can fix.
    - cron: "10 13 * * *"
    # Second attempt, same UTC day. `neff.collect` is idempotent -- observation
    # ids are content-addressed from (task_id, model_key, prompt_variant) -- so
    # if the first run succeeded this one finds nothing to do, spends nothing,
    # and commits nothing. If the first run died on something transient, this
    # one still saves the day. It cannot recover an *earlier* day and must not
    # try: `neff.collect` exposes no `--as-of`, because a forecast collected
    # today and stamped yesterday would be a fabricated observation.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Price the day without spending"
        type: boolean
        default: false
      tasks:
        description: "Tasks to collect"
        type: string
        default: "25"

concurrency:
  # Never let two collection runs overlap -- they would race on the ledger and
  # on the append-only files.
  group: daily-collection
  cancel-in-progress: false

permissions:
  contents: write
  issues: write     # the alarm below files a durable issue when a day is at risk

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify estimator before spending anything
        # If the statistics are broken, do not collect data against them.
        run: python -m pytest tests/ -q

      - name: Confirm the pre-registration is visible to CI
        # The gate in neff.collect reads `.osf_url` from the CHECKOUT. A URL that
        # exists only on the operator's laptop fails every scheduled run with a
        # message about a missing registration that is, locally, plainly there.
        # Checked here so the cause is named before any key is loaded.
        env:
          OSF_URL: ${{ vars.OSF_URL }}
        run: |
          python - <<'PY'
          import sys
          from neff.collect import OSF_URL_PATH, registered_osf_url
          url = registered_osf_url()
          if url:
              print(f"registration on record: {url}")
              sys.exit(0)
          print("::error::No OSF registration URL visible to CI.")
          print(f"::error::Commit {OSF_URL_PATH.name} to the repo, or set an OSF_URL")
          print("::error::repository variable (Settings -> Secrets and variables ->")
          print("::error::Actions -> Variables). Writing the file locally is not enough.")
          sys.exit(1)
          PY

      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OSF_URL: ${{ vars.OSF_URL }}
        run: |
          python -m neff.collect \
            --tasks "${{ github.event.inputs.tasks || 25 }}" \
            --arm ws1_prospective \
            --concurrency 4 \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee run-summary.json

      - name: Budget guard
        # Fail loudly well before the cap so there is time to react. A silent
        # drift to $200 discovered in December would end the study.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from neff.config import ARM_CAPS_USD, BUDGET_USD, LEDGER_PATH
          from neff.ledger import Ledger
          led = Ledger(LEDGER_PATH, cap_usd=BUDGET_USD, arm_caps=dict(ARM_CAPS_USD))
          s = led.summary()
          print(json.dumps(s, indent=2))
          if s["pct_used"] > 85:
              print(f"::error::budget {s['pct_used']}% consumed")
              sys.exit(1)
          if s["pct_used"] > 60:
              print(f"::warning::budget {s['pct_used']}% consumed")
          PY

      - name: Is the daily record still unbroken?
        # The study's evidence is the *continuity* of the record, not any single
        # day. Surfaced on every run so a hole is noticed while a manual re-run
        # can still fill it -- by tonight it is permanent. `always()` because the
        # run that failed to collect is exactly the run whose continuity report
        # matters most.
        if: always()
        run: python scripts/check_days.py --json

      - name: Raise an alarm if a day is at risk
        # A failed run sends one email, and ten of those went past unread in
        # August. An issue is durable, lands in the same place as the study, and
        # is still there tomorrow. Deduplicated per day so a bad stretch does not
        # bury the repo in near-identical alarms.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > alarm.txt || true
          import json, os, pathlib
          status = os.environ.get("JOB_STATUS", "")
          try:
              c = json.loads(pathlib.Path("continuity.json").read_text())
          except Exception:
              c = {}
          reasons = []
          if status not in ("success", ""):
              reasons.append(f"the collection job finished `{status}`")
          if c.get("today_state") == "late" and not c.get("today_collected"):
              reasons.append(f"{c.get('today')} is past the cron plus its usual delay and still has no observations")
          for m in c.get("below_floor", []):
              cov = c.get("coverage_window", {}).get(m)
              reasons.append(f"`{m}` is at {cov:.0%} over the last {c.get('window_days')} collected days, under the 80% floor of PREREGISTRATION.md 3.3")
          # A day older than yesterday is permanently lost and was alarmed on at
          # the time. Repeating it every morning for the rest of the study would
          # turn the alarm into wallpaper; it belongs in PREREGISTRATION.md 11
          # as a dated deviation, not in a fresh issue each day.
          import datetime as _dt
          try:
              _cut = (_dt.date.fromisoformat(c["today"]) - _dt.timedelta(days=1)).isoformat()
          except Exception:
              _cut = ""
          for m in c.get("missing_days", []):
              if m == c.get("today") or m < _cut:
                  continue          # already reported as late, or long since lost
              reasons.append(f"{m} has no observations and cannot be recovered")
          # Print nothing at all when there is nothing wrong. A bare newline is a
          # non-empty file to `test -s`, which would file an alarm every day and
          # make the alarm worthless within a week.
          if reasons:
              print("\n".join(f"- {r}" for r in reasons))
          PY
          if [ ! -s alarm.txt ]; then
            echo "nothing to raise"
            exit 0
          fi
          DAY="$(date -u +%Y-%m-%d)"
          TITLE="collection at risk: ${DAY}"
          BODY="$(cat alarm.txt)

          Run: ${RUN_URL}

          A day that is still missing tonight is missing permanently -- collection
          cannot be back-dated. If today has not landed, re-run it now:
          Actions -> daily-collection -> Run workflow."
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Panel health
        run: |
          python - <<'PY'
          import json
          from neff.panel import load_panel, describe
          p = load_panel(require_resolved=False)
          print(json.dumps(describe(p), indent=2, default=str))
          PY

      - name: Commit the day
        run: |
          git config user.name  "neff-collector"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no new data"
          else
            git commit -m "data: collection for $(date -u +%Y-%m-%d)"
            # The panel may have run while a push landed; rebase rather than fail,
            # because a lost day cannot be recovered later.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-summary-${{ github.run_number }}
          path: run-summary.json
          retention-days: 90
